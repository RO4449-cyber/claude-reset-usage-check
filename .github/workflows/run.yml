name: Claude Usage Reset Scanner

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send a test notification to ntfy"
        type: boolean
        default: false
      send_monthly_report:
        description: "Send the monthly stats report now"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: claude-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore scanner state
        uses: actions/cache@v4
        with:
          path: |
            seen_posts.txt
            state.json
            last_heartbeat.txt
          key: scanner-state-v3-${{ github.run_id }}
          restore-keys: |
            scanner-state-v3-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run scanner
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          SEND_TEST: ${{ inputs.send_test }}
          SEND_MONTHLY: ${{ inputs.send_monthly_report }}
        run: python scanner.py
