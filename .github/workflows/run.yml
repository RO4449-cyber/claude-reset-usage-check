name: Claude Usage Reset Scanner

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore seen posts cache
        uses: actions/cache@v4
        with:
          path: seen_posts.txt
          key: seen-posts-${{ github.run_id }}
          restore-keys: |
            seen-posts-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run scanner
        run: python scanner.py
